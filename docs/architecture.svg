<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive,sans-serif">
  <rect x="0" y="0" width="1040" height="620" fill="#fffdf5"/>
  <text x="520" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#1f2937">Stablecoin System Architecture — Assignment 2</text>

  <!-- User -->
  <rect x="60" y="120" width="180" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="150" y="172" text-anchor="middle" font-size="24" font-weight="bold" fill="#0c4a6e">User</text>
  <text x="150" y="204" text-anchor="middle" font-size="16" fill="#0c4a6e">(EOA / redeemer)</text>

  <!-- Vault -->
  <rect x="400" y="110" width="220" height="140" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="510" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#14532d">Vault</text>
  <text x="510" y="180" text-anchor="middle" font-size="15" fill="#14532d">deposit(): 1 : 1 mint</text>
  <text x="510" y="204" text-anchor="middle" font-size="15" fill="#14532d">redeem(): burn &#8594; refund</text>
  <text x="510" y="232" text-anchor="middle" font-size="14" fill="#166534">holds MINTER_ROLE</text>

  <!-- MockUSDC -->
  <rect x="760" y="110" width="220" height="140" rx="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
  <text x="870" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="#713f12">MockUSDC</text>
  <text x="870" y="180" text-anchor="middle" font-size="15" fill="#713f12">6-decimal collateral</text>
  <text x="870" y="204" text-anchor="middle" font-size="15" fill="#713f12">the reserve</text>

  <!-- SimpleStablecoin -->
  <rect x="400" y="380" width="220" height="140" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="510" y="416" text-anchor="middle" font-size="20" font-weight="bold" fill="#3b0764">SimpleStablecoin</text>
  <text x="510" y="444" text-anchor="middle" font-size="15" fill="#3b0764">sUSD (6 decimals)</text>
  <text x="510" y="468" text-anchor="middle" font-size="14" fill="#3b0764">mint / pause / roles</text>
  <text x="510" y="492" text-anchor="middle" font-size="14" fill="#3b0764">burnFrom any (risk!)</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.5"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.5"/></marker>
  </defs>

  <!-- user -> vault approve+deposit -->
  <path d="M240,160 L395,160" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="318" y="142" text-anchor="middle" font-size="15" fill="#334155">approve + deposit</text>

  <!-- vault -> usdc transferFrom -->
  <path d="M620,165 L755,165" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="688" y="147" text-anchor="middle" font-size="15" fill="#334155">transferFrom</text>

  <!-- vault -> stable mint -->
  <path d="M510,250 L510,375" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="600" y="315" text-anchor="middle" font-size="15" fill="#334155">mint(user, amount) 1 : 1</text>

  <!-- stable -> user sUSD balance -->
  <path d="M395,440 L150,440 L150,245" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="268" y="425" text-anchor="middle" font-size="15" fill="#334155">sUSD balance</text>

  <!-- redeem path: user burns via vault -->
  <path d="M120,245 L120,560 L398,560 L398,520" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="258" y="548" text-anchor="middle" font-size="15" fill="#7c3aed">redeem: burn sUSD &#8594; collateral returned</text>

  <!-- Ex3 attack -->
  <path d="M940,255 Q940,330 625,410" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#r)"/>
  <text x="840" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">Ex3 attack: MINTER_ROLE granted</text>
  <text x="840" y="354" text-anchor="middle" font-size="15" fill="#dc2626">to attacker &#8594; mint with 0 collateral</text>
  <text x="840" y="378" text-anchor="middle" font-size="15" fill="#dc2626">&#8658; invariant breaks, coin depegs</text>

  <!-- invariant box -->
  <rect x="60" y="290" width="230" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="175" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">Safety invariant</text>
  <text x="175" y="344" text-anchor="middle" font-size="15" fill="#991b1b">totalCollateral() &#8805; totalSupply()</text>

  <text x="520" y="606" text-anchor="middle" font-size="14" fill="#6b7280">Solid = happy path &#183; dashed purple = redemption &#183; dashed red = the Ex3 break-the-peg attack</text>
</svg>
